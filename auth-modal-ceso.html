<!-- Modal GOB.mx v3 compliant: CESO Authentication -->
<div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true" data-org="CESO">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="authModalLabel">
          <span class="bootstrap-icons" aria-hidden="true">
            <i class="bi bi-shield-check"></i>
          </span>
          Acceso Administrativo — CESO
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3 d-flex align-items-center gap-3">
          <div style="font-size:2rem;color:#C9B037"><i class="bi bi-building"></i></div>
          <div>
            <strong class="fw-bold" style="font-family: 'Patria', 'Noto Sans', Arial, sans-serif;">CESO</strong>
            <div class="small text-muted">Consejo Estatal de Seguimiento Operativo</div>
          </div>
        </div>
        <hr class="my-3">
        <form id="governmentLoginForm">
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="authEmail" class="form-label fw-bold">Correo Electrónico Institucional:</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-at"></i></span>
                  <input type="email" class="form-control form-control-lg" id="authEmail" placeholder="usuario@agricultura.gob.mx" required aria-required="true">
                </div>
                <div class="form-text">Use su correo oficial del gobierno</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="authPassword" class="form-label fw-bold">Contraseña:</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control form-control-lg" id="authPassword" required aria-required="true">
                  <button class="btn btn-secondary" type="button" id="togglePassword" aria-label="Mostrar/Ocultar contraseña"><i class="bi bi-eye"></i></button>
                </div>
                <div class="form-text">Contraseña del sistema</div>
              </div>
            </div>
          </div>
          <div id="authError" class="alert alert-danger d-none" role="alert"><span id="authErrorMessage"></span></div>
          <div id="authSuccess" class="alert alert-success d-none" role="alert"><span id="authSuccessMessage"></span></div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">
              <span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-box-arrow-in-right"></i></span>
              Iniciar Sesión Administrativa
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Script: GOB.mx modal accessibility and auth logic -->
<script>
document.getElementById('togglePassword').addEventListener('click', function(){
  const p = document.getElementById('authPassword');
  const i = this.querySelector('i');
  if (p.type === 'password') { p.type = 'text'; i.className = 'bi bi-eye-slash'; } else { p.type = 'password'; i.className = 'bi bi-eye'; }
});

document.getElementById('governmentLoginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const organization = document.getElementById('authModal').dataset.org || 'CESO';
  document.getElementById('authError').classList.add('d-none');
  document.getElementById('authSuccess').classList.add('d-none');
  const btn = this.querySelector('button[type="submit"]');
  const orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-hourglass"></i></span> Verificando...';
  setTimeout(() => {
    const result = window.gobmxAuth.authenticate(email, password, organization);
    if (result.success) {
      document.getElementById('authSuccessMessage').textContent = result.message;
      document.getElementById('authSuccess').classList.remove('d-none');
      if (window.firebase && firebase.auth) {
        firebase.auth().signInWithEmailAndPassword(email, password)
          .then(() => {
            document.getElementById('authSuccessMessage').textContent = result.message + ' — Sesión iniciada en Firebase.';
            updateAuthenticationUI();
            setTimeout(()=>{ const modal = bootstrap.Modal.getInstance(document.getElementById('authModal')); if (modal) modal.hide(); document.getElementById('governmentLoginForm').reset(); }, 900);
          })
          .catch((fbErr) => {
            document.getElementById('authSuccessMessage').textContent = result.message + ' — (No se pudo iniciar sesión en Firebase: ' + (fbErr && fbErr.message) + ')';
            updateAuthenticationUI();
            setTimeout(()=>{ const modal = bootstrap.Modal.getInstance(document.getElementById('authModal')); if (modal) modal.hide(); document.getElementById('governmentLoginForm').reset(); }, 1200);
          });
      } else {
        updateAuthenticationUI();
        setTimeout(()=>{ const modal = bootstrap.Modal.getInstance(document.getElementById('authModal')); if (modal) modal.hide(); document.getElementById('governmentLoginForm').reset(); }, 1200);
      }
    } else {
      document.getElementById('authErrorMessage').textContent = result.message;
      document.getElementById('authError').classList.remove('d-none');
    }
    btn.disabled = false; btn.innerHTML = orig;
  }, 800);
});

function updateAuthenticationUI(){
  try{
    const user = window.gobmxAuth.getCurrentUser();
    if (!user) return;
    const bar = document.getElementById('authStatusBar'); if(bar) bar.classList.remove('d-none');
  }catch(e){console.debug(e)}
}
</script>
