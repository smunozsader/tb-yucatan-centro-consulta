<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CESO - Acceso</title>
  
  <!-- REQUIRED: Official GOB.mx Framework -->
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/images/favicon.ico" rel="shortcut icon">
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/styles/main.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <!-- Contenido -->
  <main class="page">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <h1 class="h3 text-center mb-4" style="font-family: 'Patria', 'Noto Sans', Arial, sans-serif;">CESO — Acceso administrativo</h1>
          <p class="text-muted text-center mb-4">Acceso al Centro de Consulta disponible solo para usuarios autenticados.</p>
          <form id="cesoLoginForm" autocomplete="on">
            <div class="mb-3">
              <label for="cesoEmail" class="form-label fw-bold">Correo electrónico institucional:</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-at"></i></span>
                <input type="email" class="form-control form-control-lg" id="cesoEmail" placeholder="usuario@organizacion.gob.mx" required aria-required="true">
              </div>
              <div class="form-text">Use su correo oficial del gobierno</div>
            </div>
            <div class="mb-3">
              <label for="cesoPassword" class="form-label fw-bold">Contraseña:</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control form-control-lg" id="cesoPassword" placeholder="Contraseña" required aria-required="true">
                <button class="btn btn-secondary" type="button" id="togglePassword" aria-label="Mostrar/Ocultar contraseña"><i class="bi bi-eye"></i></button>
              </div>
              <div class="form-text">Contraseña del sistema</div>
            </div>
            <div class="form-check mb-3">
              <input type="checkbox" class="form-check-input" id="cesoRemember">
              <label class="form-check-label" for="cesoRemember">Recordarme</label>
            </div>
            <div id="cesoAuthError" class="alert alert-danger d-none" role="alert"><span id="cesoAuthErrorMessage"></span></div>
            <div id="cesoAuthSuccess" class="alert alert-success d-none" role="alert"><span id="cesoAuthSuccessMessage"></span></div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <button type="submit" class="btn btn-primary btn-lg">
                <span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-box-arrow-in-right"></i></span>
                Autenticar
              </button>
              <a href="index.html" class="btn btn-secondary btn-lg ms-2" aria-label="Volver al sitio principal">Volver</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="__/firebase/init.js"></script>
  <script src="auth-system.js"></script>
  <script src="https://framework-gb.cdn.gob.mx/gm/v3/assets/js/gobmx.js"></script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function(){
      const p = document.getElementById('cesoPassword');
      const i = this.querySelector('i');
      if (p.type === 'password') { p.type = 'text'; i.className = 'bi bi-eye-slash'; } else { p.type = 'password'; i.className = 'bi bi-eye'; }
    });
    document.getElementById('cesoLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('cesoEmail').value.trim();
      const password = document.getElementById('cesoPassword').value;
      const remember = document.getElementById('cesoRemember').checked;
      document.getElementById('cesoAuthError').classList.add('d-none');
      document.getElementById('cesoAuthSuccess').classList.add('d-none');
      const btn = this.querySelector('button[type="submit"]');
      const orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-hourglass"></i></span> Verificando...';
      setTimeout(() => {
        const result = window.gobmxAuth.authenticate(email, password, 'CESO');
        if (result.success) {
          document.getElementById('cesoAuthSuccessMessage').textContent = result.message;
          document.getElementById('cesoAuthSuccess').classList.remove('d-none');
          if (window.firebase && firebase.auth) {
            firebase.auth().signInWithEmailAndPassword(email, password)
              .then(() => {
                window.location.href = 'acuerdos-ceso.html';
              })
              .catch((fbErr) => {
                window.location.href = 'acuerdos-ceso.html';
              });
          } else {
            window.location.href = 'acuerdos-ceso.html';
          }
        } else {
          document.getElementById('cesoAuthErrorMessage').textContent = result.message;
          document.getElementById('cesoAuthError').classList.remove('d-none');
        }
        btn.disabled = false; btn.innerHTML = orig;
      }, 800);
    });
  </script>

  <!-- Framework gob.mx v3 Scripts -->
  <script src="https://framework-gb.cdn.gob.mx/gm/v3/assets/js/gobmx.js"></script>
</body>
</html>
