<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CESO - Acceso</title>
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/styles/main.css" rel="stylesheet">
  <style>body{padding:28px;display:flex;align-items:center;justify-content:center;height:100vh;background:#f7f7f7} .card{max-width:720px;width:100%;padding:28px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.08);background:#fff}</style>
</head>
<body>
  <div class="card">
    <h1 class="h4">CESO - Acceso administrativo</h1>
    <p class="text-muted">Pulse "Autenticar" para ingresar al Centro de Consulta de Acuerdos.</p>
      <div class="mt-3">
      <button class="btn btn-gobierno-principal" id="cesoAuthBtn">Autenticar</button>
      <a href="index.html" class="btn btn-light ms-2" aria-label="Volver al sitio principal">Volver</a>
    </div>
    <p class="small text-muted mt-2">Acceso al Centro de Consulta disponible solo para usuarios autenticados.</p>
    <div id="authModalContainer"></div>
  </div>

  <script src="auth-system.js"></script>
  <script>
    (function(){
      let modalLoaded = false;
      function executeInjectedScripts(container){
        const scripts = Array.from(container.querySelectorAll('script'));
        scripts.forEach(oldScript => {
          try {
            const newScript = document.createElement('script');
            if (oldScript.src) { newScript.src = oldScript.src; newScript.async = false; }
            else { newScript.textContent = oldScript.textContent; }
            document.body.appendChild(newScript);
            oldScript.parentNode && oldScript.parentNode.removeChild(oldScript);
          } catch (err) { console.error('Error executing injected auth-modal script:', err); }
        });
      }

      function loadAuthModal(){
        return fetch('auth-modal-ceso.html').then(r=>r.text()).then(html=>{ const c=document.getElementById('authModalContainer'); c.innerHTML=html; executeInjectedScripts(c); modalLoaded=true; return true; }).catch(err=>{ console.error('Failed to load auth-modal for CESO:', err); modalLoaded=false; });
      }

      loadAuthModal();
      const btn = document.getElementById('cesoAuthBtn');
      if (btn) btn.addEventListener('click', function(){ if (!modalLoaded){ loadAuthModal().then(()=>{ const modalEl=document.getElementById('authModal'); if(modalEl) new bootstrap.Modal(modalEl).show(); }); } else { const modalEl=document.getElementById('authModal'); if(modalEl) new bootstrap.Modal(modalEl).show(); } });

      // Redirect to the CESO Centro de Consulta after successful login
      const redirectTarget = 'acuerdos-ceso.html';
      const checkAuthAndRedirect = function(){ try{ if (window.gobmxAuth && typeof window.gobmxAuth.isAuthenticated === 'function' && window.gobmxAuth.isAuthenticated()){ window.location.href = redirectTarget; } }catch(e){}
      };
      const pollId = setInterval(checkAuthAndRedirect, 600);
      window.addEventListener('focus', checkAuthAndRedirect);
      setTimeout(()=>{ clearInterval(pollId); }, 30000);
    })();
  </script>
</body>
</html>
