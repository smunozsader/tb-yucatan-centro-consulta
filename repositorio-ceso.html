<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repositorio CESO - Centro de Consulta</title>
  
  <!-- REQUIRED: Official GOB.mx Framework -->
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/images/favicon.ico" rel="shortcut icon">
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/styles/main.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <style>
    body { padding: 24px; }
    .card-repo { margin-bottom: 12px; }
    .ceso-brand {
      background: linear-gradient(135deg, #611232, #9d2449);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    /* Government-compliant navigation styling */
    nav.row {
      background-color: #f8f9fa;
      border-radius: 8px;
      margin: 0;
    }
    
    @media (max-width: 768px) {
      nav.row .col-md-8,
      nav.row .col-md-4 {
        text-align: center !important;
        margin-bottom: 0.5rem;
      }
      
      .btn-group {
        flex-direction: column;
        width: 100%;
      }
      
      .btn-group .btn {
        border-radius: 0.375rem !important;
        margin-bottom: 0.25rem;
      }
    }
  </style>
</head>
<body>
  <!-- Content goes inside main.page structure -->
  <main class="page">
    <div class="container" style="padding-top: 60px;">
      <div class="row">
      <div class="col-12">
        <!-- CESO Branding Section -->
        <div class="ceso-brand text-center position-relative">
          <!-- Language Toggle -->
          <div class="position-absolute top-0 end-0 m-3">
            <div class="btn-group btn-group-sm" role="group" aria-label="Language Toggle">
              <button type="button" class="btn btn-outline-light active" id="btnSpanish" onclick="setLanguage('es')">
                🇲🇽 ESPAÑOL
              </button>
              <button type="button" class="btn btn-outline-light" id="btnEnglish" onclick="setLanguage('en')">
                🇺🇸 ENGLISH
              </button>
            </div>
          </div>
          
          <h1><span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-archive"></i></span> <span data-es="Repositorio CESO" data-en="CESO Repository">Repositorio CESO</span></h1>
          <p class="mb-0" data-es="Consejo Estatal de Seguimiento Operativo del SINIDA" data-en="State Council for SINIDA Operational Monitoring">Consejo Estatal de Seguimiento Operativo del SINIDA</p>
          <small data-es="Gestión de documentos oficiales para acuerdos sanitarios y seguimiento operativo" data-en="Official document management for health agreements and operational monitoring">Gestión de documentos oficiales para acuerdos sanitarios y seguimiento operativo</small>
        </div>

        <!-- Navigation -->
        <nav class="row align-items-center mb-4 py-3 border-bottom">
          <div class="col-md-8">
            <div class="btn-group" role="group" aria-label="Navegación principal">
              <a href="hall-ceso.html" class="btn btn-primary">
                <span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-house"></i></span>
                <span data-es="Panel CESO" data-en="CESO Panel">Panel CESO</span>
              </a>
              <a href="acuerdos-ceso.html" class="btn btn-secondary">
                <span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-file-text"></i></span>
                <span data-es="Acuerdos CESO" data-en="CESO Agreements">Acuerdos CESO</span>
              </a>
            </div>
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-danger" id="logoutBtn" type="button">
              <span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-box-arrow-right"></i></span>
              <span data-es="Cerrar Sesión" data-en="Sign Out">Cerrar Sesión</span>
            </button>
          </div>
        </nav>

        <div id="repoAlerts"></div>

        <!-- Upload Section -->
        <div class="card card-repo border-primary">
          <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0"><span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-cloud-upload"></i></span> <span data-es="Subir Documento CESO" data-en="Upload CESO Document">Subir Documento CESO</span></h5>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-6">
                <label class="form-label" data-es="Categoría" data-en="Category">Categoría</label>
                <select id="repoCategory" class="form-select">
                  <option value="actas-ceso" data-es="Actas de Reuniones CESO" data-en="CESO Meeting Minutes">Actas de Reuniones CESO</option>
                  <option value="normativas-ceso" data-es="Normativas SINIDA" data-en="SINIDA Regulations">Normativas SINIDA</option>
                  <option value="manuales-ceso" data-es="Manuales Operativos" data-en="Operational Manuals">Manuales Operativos</option>
                  <option value="formatos-ceso" data-es="Formatos y Plantillas" data-en="Forms and Templates">Formatos y Plantillas</option>
                  <option value="reportes-ceso" data-es="Reportes de Seguimiento" data-en="Follow-up Reports">Reportes de Seguimiento</option>
                  <option value="certificaciones-ceso" data-es="Certificaciones" data-en="Certifications">Certificaciones</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Título del Documento</label>
                <input type="text" id="repoTitle" class="form-control" placeholder="Ej: Acta Sesión CESO 01/2024">
              </div>
            </div>
            <div class="row mt-3">
              <div class="col-md-8">
                <label class="form-label">Archivo</label>
                <input type="file" id="repoFile" class="form-control" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*">
                <small class="text-muted">Formatos permitidos: PDF, Word, imágenes</small>
              </div>
              <div class="col-md-4 d-flex align-items-end">
                <button id="repoUploadBtn" class="btn btn-primary w-100">
                  <i class="bi bi-upload"></i> Subir Documento
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Documents List -->
        <div class="card mt-4">
          <div class="card-header bg-light">
            <h5 class="card-title mb-0"><span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-files"></i></span> Documentos CESO</h5>
          </div>
          <div class="card-body">
            <div id="repoList">
              <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Cargando...</span>
                </div>
                <p class="mt-2">Cargando documentos...</p>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="__/firebase/init.js"></script>
  <script src="auth-system.js"></script>
  <script>
    function fmtDate(v){ 
      try{ 
        if(!v) return ''; 
        if(v.toDate) return v.toDate().toLocaleDateString('es-MX'); 
        const d=new Date(v); 
        return isNaN(d)? String(v): d.toLocaleDateString('es-MX'); 
      }catch(e){
        return String(v);
      } 
    }

    function showAlert(message, type = 'info') {
      const alerts = document.getElementById('repoAlerts');
      alerts.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>`;
      setTimeout(() => alerts.innerHTML = '', 5000);
    }

    function loadRepo(){ 
      const list = document.getElementById('repoList'); 
      list.innerHTML = '<div class="text-center"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div><p class="mt-2">Cargando documentos...</p></div>'; 
      
      db.collection('repositorio-ceso').orderBy('createdAt','desc').get().then(snap=>{
        if(!snap.size){ 
          list.innerHTML = '<div class="alert alert-info text-center"><i class="bi bi-info-circle"></i> No hay documentos CESO disponibles.</div>'; 
          return; 
        }
        
        let html = '<div class="list-group">'; 
        snap.forEach(d=>{ 
          const md = d.data(); 
          const categoryIcon = {
            'actas-ceso': 'bi-file-earmark-text',
            'normativas-ceso': 'bi-shield-check',
            'manuales-ceso': 'bi-book',
            'formatos-ceso': 'bi-file-earmark',
            'reportes-ceso': 'bi-graph-up',
            'certificaciones-ceso': 'bi-award'
          };
          const icon = categoryIcon[md.category] || 'bi-file-earmark';
          
          html += `<div class="list-group-item list-group-item-action">
            <div class="d-flex w-100 justify-content-between align-items-start">
              <div class="flex-grow-1">
                <h6 class="mb-1"><i class="${icon} text-primary"></i> ${md.title || md.filename || 'Documento'}</h6>
                <p class="mb-1 text-muted">${md.category ? md.category.replace('-ceso', '').toUpperCase() : 'GENERAL'}</p>
                <small class="text-muted">Subido: ${fmtDate(md.createdAt)} • Por: ${md.uploader || 'Usuario'}</small>
              </div>
              <div class="ms-3">
                <button class="btn btn-outline-primary btn-sm repo-download" data-path="${md.storagePath || ''}">
                  <i class="bi bi-download"></i> Descargar
                </button>
              </div>
            </div>
          </div>`; 
        }); 
        html += '</div>'; 
        list.innerHTML = html; 
        
        // Add download handlers
        Array.from(list.querySelectorAll('button.repo-download')).forEach(b=> 
          b.addEventListener('click', function(ev){ 
            ev.preventDefault(); 
            const p=b.getAttribute('data-path'); 
            if(!p) return showAlert('Ruta del archivo faltante', 'danger'); 
            
            b.innerHTML = '<span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-hourglass-split"></i></span> Cargando...';
            b.disabled = true;
            
            firebase.storage().ref(p).getDownloadURL().then(u=> {
              window.open(u,'_blank');
              b.innerHTML = '<i class="bi bi-download"></i> Descargar';
              b.disabled = false;
            }).catch(err=> {
              showAlert('Error abriendo archivo: ' + err.message, 'danger');
              b.innerHTML = '<i class="bi bi-download"></i> Descargar';
              b.disabled = false;
            }); 
          })
        ); 
      }).catch(err=> {
        list.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-triangle"></i> Error cargando documentos: '+err.message+'</div>';
      }); 
    }

    // Upload functionality
    document.getElementById('repoUploadBtn').addEventListener('click', function(){ 
      const fileEl = document.getElementById('repoFile'); 
      const cat = document.getElementById('repoCategory').value || 'otros-ceso'; 
      const title = document.getElementById('repoTitle').value || ''; 
      const files = fileEl.files||[]; 
      
      if(!files.length) return showAlert('Por favor seleccione un archivo', 'warning'); 
      
      // Check authentication using gobmxAuth system
      const user = window.gobmxAuth && window.gobmxAuth.getCurrentUser();
      if(!user) return showAlert('Debe estar autenticado para subir documentos', 'danger');
      
      // Repository uploads use application-level auth (no Firebase Auth required) 
      
      const file = files[0]; 
      const storagePath = 'repositorio-ceso/'+cat+'/'+Date.now()+'_'+file.name; 
      const ref = firebase.storage().ref(storagePath); 
      
      // Show upload progress
      this.innerHTML = '<span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-hourglass-split"></i></span> Subiendo...';
      this.disabled = true;
      showAlert('Subiendo archivo...', 'info');
      
      ref.put(file).then(()=> ref.getMetadata()).then(()=> {
        return db.collection('repositorio-ceso').add({ 
          category: cat, 
          title: title||file.name, 
          filename: file.name, 
          storagePath: storagePath, 
          uploader: user.email || user.nombre || 'Usuario', 
          createdAt: firebase.firestore.FieldValue.serverTimestamp() 
        })
      }).then(()=>{ 
        showAlert('¡Documento subido exitosamente!', 'success'); 
        document.getElementById('repoFile').value = ''; 
        document.getElementById('repoTitle').value = ''; 
        this.innerHTML = '<span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-upload"></i></span> Subir Documento';
        this.disabled = false;
        loadRepo(); 
      }).catch(err=> {
        showAlert('Error subiendo archivo: ' + err.message, 'danger');
        this.innerHTML = '<span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-upload"></i></span> Subir Documento';
        this.disabled = false;
      }); 
    });

    // Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', function() {
      const btn = this;
      const originalText = btn.innerHTML;
      
      // Show loading state
      btn.disabled = true;
      btn.innerHTML = '<span class="bootstrap-icons" aria-hidden="true"><i class="bi bi-box-arrow-right"></i></span> <span data-es="Cerrando Sesión..." data-en="Signing Out...">Cerrando Sesión...</span>';
      
      firebase.auth().signOut().then(() => {
        window.location.href = 'index.html';
      }).catch((error) => {
        console.error('Error signing out:', error);
        showAlert('Error al cerrar sesión: ' + error.message, 'danger');
        btn.disabled = false;
        btn.innerHTML = originalText;
      });
    });

    // Language switching functionality
    function getCurrentLanguage() {
      return localStorage.getItem('preferredLanguage') || 'es';
    }

    function setLanguage(lang) {
      localStorage.setItem('preferredLanguage', lang);
      
      // Update button states
      document.getElementById('btnSpanish').classList.toggle('active', lang === 'es');
      document.getElementById('btnEnglish').classList.toggle('active', lang === 'en');
      
      // Update all translatable elements
      document.querySelectorAll('[data-es][data-en]').forEach(element => {
        if (lang === 'es') {
          element.textContent = element.getAttribute('data-es');
        } else {
          element.textContent = element.getAttribute('data-en');
        }
      });

      // Update select options
      document.querySelectorAll('option[data-es][data-en]').forEach(option => {
        if (lang === 'es') {
          option.textContent = option.getAttribute('data-es');
        } else {
          option.textContent = option.getAttribute('data-en');
        }
      });
    }

    // Initialize language on page load
    document.addEventListener('DOMContentLoaded', function() {
      const currentLang = getCurrentLanguage();
      setLanguage(currentLang);
    });

    // Initial load
    loadRepo();
  </script>

  <!-- Government Framework JavaScript -->
  <script src="https://framework-gb.cdn.gob.mx/gm/v3/assets/js/gobmx.js"></script>

</body>
</html>
