<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APHIS - Acceso</title>
  
  <!-- REQUIRED: Official GOB.mx Framework -->
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/images/favicon.ico" rel="shortcut icon">
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/styles/main.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <style>
    body {
      padding: 0;
      margin: 0;
      min-height: 100vh;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
    }
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }
  </style>
</head>
<body>
  <!-- Contenido -->
  <main class="page" style="padding-top: 60px;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <h1 class="h3 text-center mb-4">APHIS - Acceso administrativo</h1>
          <p class="text-muted text-center mb-4">Acceso al Centro de Consulta disponible solo para usuarios autenticados.</p>

          <form role="form" id="aphisLoginForm">
            <div class="form-group">
              <label class="control-label" for="aphisEmail">Correo electrónico institucional:</label>
              <input class="form-control" id="aphisEmail" placeholder="usuario@organizacion.gob.mx" type="email" required="">
            </div>
            <div class="form-group">
              <label class="control-label" for="aphisPassword">Contraseña:</label>
              <input class="form-control" id="aphisPassword" placeholder="Contraseña" type="password" required="">
            </div>
            <div class="checkbox">
              <label>
                <input type="checkbox" id="aphisRemember">
                Recordarme
              </label>
            </div>
            <div id="aphisAuthError" class="alert alert-danger d-none" role="alert"><span id="aphisAuthErrorMessage"></span></div>
            <div id="aphisAuthSuccess" class="alert alert-success d-none" role="alert"><span id="aphisAuthSuccessMessage"></span></div>
            <button class="btn btn-primary pull-right" type="submit">Autenticar</button>
            <a href="index.html" class="btn btn-light ms-2" aria-label="Volver al sitio principal">Volver</a>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="__/firebase/init.js"></script>
  <script src="auth-system.js"></script>
  <script src="https://framework-gb.cdn.gob.mx/gm/v3/assets/js/gobmx.js"></script>
  <script>
    $gmx(document).ready(function() {
      document.getElementById('aphisLoginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('aphisEmail').value.trim();
        const password = document.getElementById('aphisPassword').value;
        const remember = document.getElementById('aphisRemember').checked;

        // Clear messages
        document.getElementById('aphisAuthError').classList.add('d-none');
        document.getElementById('aphisAuthSuccess').classList.add('d-none');

        const btn = this.querySelector('button[type="submit"]');
        const orig = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = 'Verificando...';

        setTimeout(() => {
          const result = window.gobmxAuth.authenticate(email, password, 'APHIS');
          if (result.success) {
            document.getElementById('aphisAuthSuccessMessage').textContent = result.message;
            document.getElementById('aphisAuthSuccess').classList.remove('d-none');
            // Try to sign in to Firebase Auth
            if (window.firebase && firebase.auth) {
              firebase.auth().signInWithEmailAndPassword(email, password)
                .then(() => {
                  console.log('✅ Firebase auth successful for', email);
                  // Redirect to acuerdos-aphis.html
                  window.location.href = 'acuerdos-aphis.html';
                })
                .catch((fbErr) => {
                  console.warn('Firebase signIn failed:', fbErr && fbErr.message);
                  // Still redirect even if Firebase fails
                  window.location.href = 'acuerdos-aphis.html';
                });
            } else {
              // No firebase SDK available; redirect anyway
              window.location.href = 'acuerdos-aphis.html';
            }
          } else {
            document.getElementById('aphisAuthErrorMessage').textContent = result.message;
            document.getElementById('aphisAuthError').classList.remove('d-none');
          }
          btn.disabled = false;
          btn.innerHTML = orig;
        }, 800);
      });
    });
  </script>

  <!-- Framework gob.mx v3 Scripts -->
  <script src="https://framework-gb.cdn.gob.mx/gm/v3/assets/js/gobmx.js"></script>
</body>
</html>
