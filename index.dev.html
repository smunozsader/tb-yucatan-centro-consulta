<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro de Consulta de Acuerdos Sanitarios - Gobierno de México</title>
    
    <!-- Government Framework -->
    <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/images/favicon.ico" rel="shortcut icon">
    <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/styles/main.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- jQuery UI for Datepicker -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/ui-lightness/jquery-ui.css">
    
    <!-- Meta tags -->
    <meta name="description" content="Centro de consulta especializado para acuerdos sanitarios entre CESO y APHIS-USDA en Yucatán. Gobierno de México.">
    <meta name="keywords" content="acuerdos sanitarios, CESO, APHIS-USDA, Yucatán, gobierno, México">
    <meta name="author" content="Gobierno de México">
</head>
<body>
    <!-- Government header will be injected by framework -->
    <div id="root"></div>
    
    <!-- Government framework scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://framework-gb.cdn.gob.mx/gm/v3/assets/js/gobmx.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    
    <!-- Custom styles for government datepicker -->
    <style>
        /* Government Datepicker Styles */
        .ui-datepicker {
            font-family: 'Nunito Sans', sans-serif !important;
            border-radius: 8px !important;
            border: 2px solid #e9ecef !important;
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important;
            background: #fff !important;
            padding: 12px !important;
        }
        
        .ui-datepicker-header {
            background: linear-gradient(135deg, #721c24 0%, #9a2128 100%) !important;
            color: #fff !important;
            border-radius: 6px !important;
            border: none !important;
            font-weight: 600 !important;
            padding: 8px !important;
        }
        
        .ui-datepicker-prev, .ui-datepicker-next {
            background: rgba(255,255,255,.2) !important;
            border-radius: 4px !important;
            color: #fff !important;
        }
        
        .ui-datepicker-calendar td a {
            border-radius: 6px !important;
            padding: 8px !important;
            color: #495057 !important;
            transition: all 0.3s ease !important;
        }
        
        .ui-datepicker-calendar td a:hover {
            background: #f8f9fa !important;
            color: #721c24 !important;
            border: 1px solid #721c24 !important;
        }
        
        .ui-datepicker-calendar .ui-state-active {
            background: #721c24 !important;
            color: #fff !important;
            border: none !important;
        }
        
        .ui-datepicker-today a {
            background: #e3f2fd !important;
            border: 1px solid #2196f3 !important;
            color: #1976d2 !important;
        }
        
        .input-group .form-control.hasDatepicker {
            border-left: none !important;
        }
        
        .input-group .input-group-text {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%) !important;
            color: #721c24 !important;
            border-right: none !important;
            font-weight: 600 !important;
        }
        
        /* Loading styles */
        .app-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        
        .loading-content {
            text-align: center;
            color: #611232;
        }
        
        .loading-spinner {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
    
    <!-- Government framework initialization -->
    <script>
        // Initialize government framework when DOM is ready
        $gmx(document).ready(function() {
            console.log('🏛️ Framework gob.mx v3 cargado correctamente');
            console.log('🚀 Centro de Consulta de Acuerdos Sanitarios inicializado');
            
            // Initialize tooltips if available
            if (typeof $gmx.fn !== 'undefined' && $gmx.fn.tooltip) {
                $gmx('[data-bs-toggle="tooltip"]').tooltip();
            }
            
            console.log('📄 Header y footer oficiales de gob.mx activados');
            console.log('🎯 Sistema: Centro de Consulta de Acuerdos Sanitarios CESO-APHIS');
        });
        
        // Suppress detectOverflow errors
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('detectOverflow')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
    
    <!-- Vite will inject the React app script here -->
    <script type="module" src="/src-development/main.jsx"></script>

    <!-- Framework gob.mx v3 Scripts -->
    <script src="https://framework-gb.cdn.gob.mx/gm/v3/assets/js/gobmx.js"></script>
</body>
</html>
