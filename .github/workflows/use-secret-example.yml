name: Example - Use FIREBASE_ADMIN_KEY secret

on:
  workflow_dispatch:
  pull_request:

jobs:
  use-secret:
    name: Use secret (example)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write secret to file (runner only)
        run: |
          # write secret to a file for a runner job (do not print contents)
          printf '%s' "${{ secrets.FIREBASE_ADMIN_KEY }}" > serviceAccountKey.json
          echo "Wrote secret to serviceAccountKey.json"
          echo "File size: $(wc -c < serviceAccountKey.json) bytes"

      - name: Example usage placeholder
        run: |
          # Placeholder: here you would run scripts that need the admin key, e.g.:
          # node scripts/use-firebase-admin.js --key serviceAccountKey.json
          echo "(no-op)"

      - name: Cleanup
        run: |
          rm -f serviceAccountKey.json
          echo "Removed temporary secret file"
