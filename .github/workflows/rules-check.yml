name: Rules CI

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'tests/**'

jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Start emulators and run rules tests
        run: |
          npx firebase emulators:exec "node tests/firestore-rules.test.js"
