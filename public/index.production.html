<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Centro de Consulta de Acuerdos Sanitarios - Gobierno de México</title>
  
  <!-- REQUIRED: Official GOB.mx Framework -->
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/images/favicon.ico" rel="shortcut icon">
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/styles/main.css" rel="stylesheet">
  
  <!-- Additional CSS for jQuery UI and custom styles -->
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/ui-lightness/jquery-ui.css">
  
  <!-- Metadata -->
  <meta name="description" content="Centro de consulta especializado para acuerdos sanitarios entre CESO y APHIS-USDA/SENASICA en Yucatán. Gobierno de México." />
  <meta name="keywords" content="acuerdos sanitarios, CESO, APHIS-USDA/SENASICA, tuberculosis bovina, SENASICA, Yucatán, ganadería, México" />
  <meta name="author" content="Gobierno de México" />
  
  <!-- Loading CSS -->
  <style>
    .pace {
      -webkit-pointer-events: none;
      pointer-events: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      -webkit-transform: translate3d(0, -50px, 0);
      -ms-transform: translate3d(0, -50px, 0);
      transform: translate3d(0, -50px, 0);
      -webkit-transition: -webkit-transform .5s ease-out;
      -ms-transition: -ms-transform .5s ease-out;
      transition: transform .5s ease-out;
    }

    .pace.pace-active {
      -webkit-transform: translate3d(0, 0, 0);
      -ms-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
    }

    .pace .pace-progress {
      display: block;
      position: fixed;
      z-index: 2000;
      top: 0;
      right: 100%;
      width: 100%;
      height: 2px;
      background: #611232;
      pointer-events: none;
    }

    .pace-inactive {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Loading indicator -->
  <div class="pace pace-inactive">
    <div class="pace-progress" data-progress-text="100%" data-progress="99" style="transform: translate3d(100%, 0px, 0px);">
      <div class="pace-progress-inner"></div>
    </div>
    <div class="pace-activity"></div>
  </div>

  <!-- Content goes inside main.page structure -->
  <main class="page">
    <div id="root"></div>
  </main>

  <!-- Scripts del framework gob.mx -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  
  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="__/firebase/init.js"></script>
  
  <!-- React App -->
  <script src="static/js/main.f151cabb.js"></script>
  
  <!-- Estilos customizados para datepicker gubernamental -->
  <style>
    .ui-datepicker {
      font-family: 'Nunito Sans', sans-serif !important;
      border-radius: 8px !important;
      border: 2px solid #98989A !important;
      box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important;
      background: #FFFFFF !important;
      padding: 12px !important;
    }
    
    .ui-datepicker-header {
      background: linear-gradient(135deg, #611232 0, #9d2449 100%) !important;
      color: #FFFFFF !important;
      border-radius: 6px !important;
      padding: 8px !important;
      margin-bottom: 8px !important;
    }
    
    .ui-datepicker-title {
      color: white !important;
      font-weight: bold !important;
    }
    
    .ui-datepicker-prev, .ui-datepicker-next {
      background: transparent !important;
      border: none !important;
      color: white !important;
      top: 8px !important;
    }
    
    .ui-datepicker td {
      padding: 2px !important;
    }
    
    .ui-datepicker td a {
      border-radius: 4px !important;
      padding: 8px !important;
      color: #545454 !important;
      background: transparent !important;
      border: none !important;
      transition: all 0.2s ease !important;
    }
    
    .ui-datepicker td a:hover,
    .ui-datepicker .ui-state-hover {
      background: #611232 !important;
      color: #FFFFFF !important;
    }
    
    .ui-datepicker .ui-state-active {
      background: #9d2449 !important;
      color: #FFFFFF !important;
      font-weight: bold !important;
    }
  </style>

  <script>
    // Configuración personalizada del framework gob.mx
    window.addEventListener('DOMContentLoaded', function() {
      // Inicializar tooltips del framework si están disponibles
      if (typeof window.$gmx !== 'undefined') {
        if (typeof $gmx.fn !== 'undefined' && $gmx.fn.tooltip) {
          $gmx('[data-bs-toggle="tooltip"]').tooltip();
        }
        
        console.log('📄 Header y footer oficiales de gob.mx activados');
        console.log('🎯 Sistema: Centro de Consulta de Acuerdos Sanitarios CESO-APHIS');
      }
    });

    // Manejo de errores de overflow detection
    window.addEventListener('error', function(event) {
      if (event.message && event.message.includes('detectOverflow')) {
        event.preventDefault();
        return false;
      }
    });
  </script>

  <!-- REQUIRED: Framework JS (includes official header/footer) -->
  <script src="https://framework-gb.cdn.gob.mx/gm/v3/assets/js/gobmx.js"></script>
</body>
</html>
