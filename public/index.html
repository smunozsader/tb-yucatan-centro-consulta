<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro de Consulta de Acuerdos Sanitarios - Desarrollo</title>
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  
  <!-- Framework gob.mx v3 -->
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/styles/main.css" rel="stylesheet" />
  
  <!-- Fuentes gubernamentales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Patria:wght@300;400;600;700&display=swap');
    
    /* Variables CSS gubernamentales */
    :root {
      --color-gobierno-principal: #611232;
      --color-gobierno-secundario: #9d2449;
      --color-gobierno-dorado: #a57f2c;
      --color-gobierno-verde: #13322e;
      --fuente-titulos: "Patria", serif;
      --fuente-contenido: "Nunito Sans", sans-serif;
    }
    
    /* Aplicar fuentes gubernamentales */
    .gm-font-patria {
      font-family: var(--fuente-titulos) !important;
    }
    
    .gm-font-nunito {
      font-family: var(--fuente-contenido) !important;
    }
    
    /* Estilos por defecto */
    body {
      font-family: var(--fuente-contenido) !important;
      margin: 0;
      padding: 0;
    }
    
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--fuente-titulos) !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.js"></script>

  <!-- Framework gob.mx v3 Scripts -->
  <script src="https://framework-gb.cdn.gob.mx/gm/v3/assets/js/gobmx.js"></script>
</body>
</html>
