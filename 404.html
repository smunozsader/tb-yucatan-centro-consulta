<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada - Gobierno de México</title>
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/images/favicon.ico" rel="shortcut icon">
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/styles/main.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .error-container { max-width: 600px; margin: 80px auto; padding: 40px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
    .error-title { font-size: 2.5rem; color: #611232; font-family: 'Patria', serif; margin-bottom: 1rem; }
    .error-desc { font-size: 1.2rem; color: #545454; margin-bottom: 2rem; }
    .btn-gobmx { background: #611232; color: #fff; border-radius: 8px; padding: 12px 32px; font-size: 1.1rem; border: none; }
    .btn-gobmx:hover { background: #9d2449; color: #fff; }
  </style>
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="error-container">
        <h1 class="error-title">404 - Página no encontrada</h1>
        <p class="error-desc">La página que solicitaste no existe o ha sido movida.<br>Por favor verifica la dirección o regresa al inicio.</p>
        <a href="index.html" class="btn btn-primary btn-gobmx">Ir al inicio</a>
        <div class="mt-4">
          <span class="text-muted">Centro de Consulta de Acuerdos Sanitarios - Gobierno de México</span>
        </div>
      </div>
    </div>
  </main>
  <script src="https://framework-gb.cdn.gob.mx/gm/v3/assets/js/gobmx.js"></script>
</body>
</html>
