<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repositorio - Centro de Consulta</title>
  <link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/styles/main.css" rel="stylesheet">
  <style>
    body { padding: 24px; }
    .card-repo { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col-12">
        <h1>Repositorio (Administrador)</h1>
        <p class="text-muted">Gestión centralizada de documentos oficiales: actas, normativas, manuales, formatos y reportes.</p>
        <div class="mb-3">
          <a href="index.html" class="btn btn-light">Inicio</a>
          <a href="aphis.html" class="btn btn-light">APHIS</a>
          <a href="ceso.html" class="btn btn-light">CESO</a>
        </div>

        <div id="repoAlerts"></div>

        <div class="card card-repo">
          <div class="card-body">
            <h5 class="card-title">Subir documento</h5>
            <div class="mb-2">
              <label class="form-label">Categoría</label>
              <select id="repoCategory" class="form-select">
                <option value="actas">Actas de Reuniones</option>
                <option value="normativas">Normativas</option>
                <option value="manuales">Manuales</option>
                <option value="formatos">Formatos</option>
                <option value="reportes">Reportes de seguimiento</option>
              </select>
            </div>
            <div class="mb-2">
              <input type="text" id="repoTitle" class="form-control" placeholder="Título del documento">
            </div>
            <div class="mb-2">
              <input type="file" id="repoFile" class="form-control" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*">
            </div>
            <div class="mb-2 text-end">
              <button id="repoUploadBtn" class="btn btn-primary">Subir como Administrador</button>
            </div>
          </div>
        </div>

        <h3 class="h6 mt-3">Documentos</h3>
        <div id="repoList">Cargando...</div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="__/firebase/init.js"></script>
  <script>
    function fmtDate(v){ try{ if(!v) return ''; if(v.toDate) return v.toDate().toLocaleDateString(); const d=new Date(v); return isNaN(d)? String(v): d.toLocaleDateString(); }catch(e){return String(v);} }

    function loadRepo(){ const list = document.getElementById('repoList'); list.innerHTML = '<em>Cargando...</em>'; db.collection('repositorio').orderBy('createdAt','desc').get().then(snap=>{
      if(!snap.size){ list.innerHTML = '<div class="alert alert-info">No hay documentos.</div>'; return; }
      let html = '<div class="list-group">'; snap.forEach(d=>{ const md = d.data(); html += '<a class="list-group-item list-group-item-action d-flex justify-content-between align-items-start" href="#" data-path="'+(md.storagePath||'')+'"><div><strong>'+(md.title||md.filename||'Documento')+'</strong><div><small class="text-muted">'+(md.category||'')+' • '+fmtDate(md.createdAt && md.createdAt.toDate ? md.createdAt.toDate() : md.createdAt)+'</small></div></div><div><button class="btn btn-sm btn-outline-primary repo-download" data-path="'+(md.storagePath||'')+'">Abrir</button></div></a>'; }); html += '</div>'; list.innerHTML = html; Array.from(list.querySelectorAll('button.repo-download')).forEach(b=> b.addEventListener('click', function(ev){ ev.preventDefault(); const p=b.getAttribute('data-path'); if(!p) return alert('Ruta faltante'); firebase.storage().ref(p).getDownloadURL().then(u=> window.open(u,'_blank')).catch(err=> alert('Error abriendo: '+err.message)); })); }).catch(err=> list.innerHTML = '<div class="alert alert-danger">Error: '+err.message+'</div>'); }

    document.getElementById('repoUploadBtn').addEventListener('click', function(){ const fileEl = document.getElementById('repoFile'); const cat = document.getElementById('repoCategory').value || 'otros'; const title = document.getElementById('repoTitle').value || ''; const files = fileEl.files||[]; if(!files.length) return alert('Seleccione un archivo'); const user = (firebase.auth && firebase.auth().currentUser) || null; if(!user) return alert('Debe autenticarse como Administrador para subir documentos.'); const file = files[0]; const storagePath = 'repositorio/'+cat+'/'+Date.now()+'_'+file.name; const ref = firebase.storage().ref(storagePath); ref.put(file).then(()=> ref.getMetadata()).then(()=> db.collection('repositorio').add({ category: cat, title: title||file.name, filename: file.name, storagePath: storagePath, uploader: user.email||user.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() })).then(()=>{ alert('Documento subido'); document.getElementById('repoFile').value = ''; document.getElementById('repoTitle').value = ''; loadRepo(); }).catch(err=> alert('Error subiendo: '+err.message)); });

    // initial
    loadRepo();
  </script>
</body>
</html>
